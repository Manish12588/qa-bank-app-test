name: QABank - Test

run-name: QABank - Test (${{ inputs.environment || 'QA' }})

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - STAGE
          - DEV

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'QA' }}

    steps:
      # The app under test lives in its own repo. Check it out next to the tests.
      - name: Checkout QABank app
        uses: actions/checkout@v4
        with:
          repository: Manish12588/qa-bank-app
          path: qabank

      - name: Start QABank and wait until healthy
        run: docker compose -f qabank/docker-compose.yml up -d --build --wait

      - name: Checkout QABank app tests
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # reportingLabs run history: powers the Trend chart, new vs known
      # failures, flaky dots and "got slower". One history per environment.
      - name: Restore reportingLabs history
        uses: actions/cache/restore@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ inputs.environment || 'QA' }}-${{ github.run_id }}
          restore-keys: reporting-labs-history-${{ inputs.environment || 'QA' }}-

      - name: Run tests
        run: npx playwright test
        env:
          ENV: ${{ inputs.environment || 'QA' }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}

      # Saved even when tests fail, so failed runs stay in the trend history.
      - name: Save reportingLabs history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ inputs.environment || 'QA' }}-${{ github.run_id }}

      - name: QABank logs
        if: failure() && hashFiles('qabank/docker-compose.yml') != ''
        run: docker compose -f qabank/docker-compose.yml logs

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html-report/
          retention-days: 30

      - name: Upload reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-labs
          path: reporting-labs/
          retention-days: 30

  publish:
    name: Publish reports
    needs: test
    # Not for pull requests: they must not overwrite the published "latest" report.
    # Runs even when the tests failed, so a red run still gets its report.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the gh-pages branch
    env:
      SELECTED_ENV: ${{ inputs.environment || 'QA' }}
      TEST_RESULT: ${{ needs.test.result }}
      RUN_ID: ${{ github.run_id }}
      ACTOR: ${{ github.actor }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Build the report site
        run: |
          set -euo pipefail
          mkdir -p site

          case "$TEST_RESULT" in
            success)   result="passed" ;;
            failure)   result="FAILED" ;;
            cancelled) result="cancelled" ;;
            *)         result="$TEST_RESULT" ;;
          esac

          links=""
          if [ -d "all-reports/html-report" ]; then
            cp -r all-reports/html-report site/html
            links="${links}<a class=\"btn\" href=\"html/index.html\">HTML report</a>"
          fi
          if [ -d "all-reports/reporting-labs" ]; then
            cp -r all-reports/reporting-labs site/rlabs
            links="${links}<a class=\"btn alt\" href=\"rlabs/index.html\">reportingLabs</a>"
          fi

          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>QABank test run ${RUN_ID}</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0; padding: 32px 16px; color: #1a1a2e; }
              main { max-width: 760px; margin: 0 auto; }
              .meta { color: #666; font-size: 14px; }
              .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin: 14px 0; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
              .card h2 { margin: 0 0 4px; font-size: 18px; }
              .card p { margin: 0 0 12px; color: #555; }
              .btn { display: inline-block; padding: 8px 16px; margin-right: 8px; border-radius: 6px; background: #1a1a2e; color: #fff; text-decoration: none; font-size: 14px; }
              .btn.alt { background: #6f42c1; }
            </style>
          </head>
          <body>
            <main>
              <h1>QABank test report</h1>
              <p class="meta">Run ${RUN_ID} &middot; ${SELECTED_ENV} &middot; started by ${ACTOR} &middot; $(date -u +'%d %b %Y, %H:%M UTC')</p>
              <div class="card"><h2>${SELECTED_ENV}</h2><p>Regression, all tests &middot; <strong>${result}</strong></p>${links}</div>
            </main>
          </body>
          </html>
          HTML

          {
            echo "## QABank tests: ${SELECTED_ENV}"
            echo ""
            echo "| Environment | Tests | Result |"
            echo "|---|---|---|"
            echo "| ${SELECTED_ENV} | All tests | ${result} |"
            echo ""
            echo "Reports (live about a minute after this run): ${PAGES_URL}/runs/${RUN_ID}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish this run
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: runs/${{ github.run_id }}
          keep_files: true

      # A fixed URL that always shows the newest run
      - name: Publish as latest
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: latest
          keep_files: true

      # Makes the root URL work: it redirects to latest/
      - name: Create root redirect page
        run: |
          mkdir redirect
          echo '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=latest/"><a href="latest/">Latest report</a>' > redirect/index.html

      - name: Publish root redirect
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: redirect
          keep_files: true
