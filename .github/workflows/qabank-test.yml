name: QABank - Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - STAGE
          - DEV

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'QA' }}

    steps:
      # The app under test lives in its own repo. Check it out next to the tests.
      - name: Checkout QABank app
        uses: actions/checkout@v4
        with:
          repository: Manish12588/qa-bank-app
          path: qabank

      - name: Start QABank and wait until healthy
        run: docker compose -f qabank/docker-compose.yml up -d --build --wait

      - name: Checkout QABank app tests
        uses: actions/checkout@v4
        with:
          repository: Manish12588/qa-bank-app-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # reportingLabs run history: powers the Trend chart, new vs known
      # failures, flaky dots and "got slower". One history per environment.
      - name: Restore reportingLabs history
        uses: actions/cache/restore@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-${{ github.run_id }}
          restore-keys: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-

      - name: Run tests
        run: npx playwright test
        env:
          ENV: ${{ github.event.inputs.environment || 'QA' }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}

      # Saved even when tests fail, so failed runs stay in the trend history.
      - name: Save reportingLabs history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-${{ github.run_id }}

      - name: QABank logs
        if: failure()
        run: docker compose -f qabank/docker-compose.yml logs

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: reports/html-report/
          retention-days: 30

      - name: Upload reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-labs-report-${{ github.run_id }}
          path: reporting-labs/
          retention-days: 30
