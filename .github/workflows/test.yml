name: tests
on:
  push: { branches: [main] }
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the QABank app
        uses: actions/checkout@v4
        with:
          repository: Manish12588/qabank # your app repo name
          path: qabank

      - name: Start QABank and wait until healthy
        run: docker compose -f qabank/docker-compose.yml up -d --build --wait

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: QABank logs
        if: failure()
        run: docker compose -f qabank/docker-compose.yml logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
